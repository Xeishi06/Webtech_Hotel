<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Stella's Beach House</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Create Account</h1>

    <form id="registerForm" novalidate>
        <label for="regName">Full Name</label>
        <input id="regName" type="text" placeholder="Enter your full name" required autocomplete="name">

        <label for="regEmail">Email</label>
        <input id="regEmail" type="email" placeholder="Enter your email" required autocomplete="email">

        <label for="regPassword">Password</label>
        <input id="regPassword" type="password" placeholder="Enter your password (min 6 chars)" required minlength="6" autocomplete="new-password">

        <label for="regPassword2">Confirm Password</label>
        <input id="regPassword2" type="password" placeholder="Confirm your password" required autocomplete="new-password">

        <button type="submit">Register</button>
    </form>

    <p>Already have an account?</p>
    <a href="login.html">Login here</a>
    <p><a href="landingpage.html">← Back to home</a></p>

</div>

<script src="main.js"></script>
</body>
</html>
