<div class="container">

    <h1>Customer Feedback</h1>

    <form id="feedbackForm" novalidate>

        <label for="fbName">Your Name</label>
        <input id="fbName" type="text" placeholder="Enter your name" required>

        <label for="fbRating">Rating</label>
        <select id="fbRating" required>
            <option value="">Select rating</option>
            <option>5 - Excellent</option>
            <option>4 - Very Good</option>
            <option>3 - Good</option>
            <option>2 - Fair</option>
            <option>1 - Poor</option>
        </select>

        <label for="fbText">Your Feedback</label>
        <textarea id="fbText"
            placeholder="Write your feedback here" required></textarea>

        <button type="submit">Submit Feedback</button>

    </form>

</div>
